name: test
on:
  push:
    branches:
    - main
  workflow_dispatch:
  pull_request:
    paths:
    - src/**
    - pyproject.toml
    - tests/**
    - "*_requirements.txt"
    - .github/workflows/test.yml
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install Hatch
      uses: pypa/hatch@install
    - run: hatch fmt --check
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        - macos-latest
        python:
        - '3.10'
        - 3.11
        - 3.12
        - 3.13
    steps:
    - uses: actions/checkout@v6
    - name: Install Hatch
      uses: pypa/hatch@install
    - name: test
      run: hatch test -py ${{ matrix.python }}
  success:
    name: success
    runs-on: ubuntu-latest
    needs:
      - test
      - lint
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    steps:
      - run: echo "Success!"
